<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Guzanda - Errepasoa</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --ink: #1f2933;
      --muted: #6b7280;
      --accent: #1d4ed8;
      --accent-dark: #1e40af;
      --green: #15803d;
      --amber: #b45309;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; font-size: 1.4rem; }
    .badge {
      display: inline-block;
      padding: .25rem .75rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
      color: #fff;
    }
    .badge.approved { background: var(--green); }
    .badge.pending { background: var(--amber); }
    dl { display: grid; gap: 1rem; margin: 1.5rem 0; }
    dt { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    dd { margin: .25rem 0 0; white-space: pre-wrap; word-break: break-word; }
    audio { width: 100%; margin-top: .5rem; }
    .cta {
      display: inline-block;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: .8rem 1.4rem;
      cursor: pointer;
    }
    .cta:hover { background: var(--accent-dark); }
    .approved-note { color: var(--green); font-weight: 600; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Guzanda - Errepasoa <span style="font-weight:400;color:var(--muted)">#{{id}}</span></h1>
    <div>{{status_badge}}</div>
    <dl>
      <dt>Izen Abizenak</dt>
      <dd>{{name}}</dd>
      <dt>Kontaktua</dt>
      <dd>{{contact}}</dd>
      <dt>Deskribapena</dt>
      <dd>{{description}}</dd>
      <dt>Audioa</dt>
      <dd>{{audio_tag}}</dd>
      <dt>Data</dt>
      <dd>{{created_at}}</dd>
    </dl>
    <p>{{approve_form}}</p>
    <p class="approved-note" id="approved-note"></p>
  </div>
</body>
</html>
