name: guzanda

services:
  guzanda:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: guzanda
    restart: unless-stopped
    ports:
      - "8005:3000"
    volumes:
      - ../private/guzanda.db:/app/private/guzanda.db
      - ../private/uploads:/app/private/uploads
      - ../public:/app/public

    env_file:
      - .env
    environment:
      - TZ=Europe/Madrid
