<!doctype html>
<html lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guzan | Guzanda Form</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="hero hero--compact">
    <div class="shell hero__content">
      <p class="tag">BERMEO · HERRI PLATAFORMA</p>
      <h1>GUZANDA</h1>
    </div>
  </header>

  <main>
    <section class="shell section section--compact">
      <div class="section__head">
        <h2>Guzanda Formularioa</h2>
      </div>
      <div class="shell">
        <form id="guzandaForm" action="/guzanda" method="post" enctype="multipart/form-data">
          <div style="margin-bottom: 1rem;">
            <label for="name" class="form-label">Izen Abizenak:</label>
            <input type="text" id="name" name="name" required placeholder="Izen Abizenak" class="form-input">
          </div>
          <div style="margin-bottom: 1rem;">
            <label for="contact" class="form-label">Telefonoa edo posta elektronikoa:</label>
            <input type="text" id="contact" name="contact" required placeholder="Telefonoa edo posta" class="form-input">
          </div>
          <div class="tabs" role="tablist">
            <button type="button" class="tab active" id="tab-text" role="tab" aria-selected="true" aria-controls="panel-text" data-tab="text">Deskribapena</button>
            <button type="button" class="tab" id="tab-audio" role="tab" aria-selected="false" aria-controls="panel-audio" data-tab="audio">Audio</button>
          </div>

          <div class="tab-panel active" id="panel-text" data-panel="text">
            <label for="description" class="form-label">Deskribapena:</label>
            <textarea id="description" name="description" rows="4" placeholder="Deskribapena hemen idatzi..." class="form-input"></textarea>
          </div>

          <div class="tab-panel" id="panel-audio" data-panel="audio">
            <div id="audioRecorder">
              <button type="button" id="recordBtn" class="cta" aria-pressed="false">Start Recording</button>
              <div class="waveform" id="waveform" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
              </div>
              <div id="audioStatus" style="margin-top: 0.5rem; font-size: 0.9rem; color: var(--muted);"></div>
              <div class="audio-actions" id="audioActions" hidden>
                <p class="audio-ready">✔ Audio gordeta dago / Audio saved</p>
                <button type="button" id="removeAudioBtn" class="cta cta--ghost">Ezabatu / Remove &amp; Record Another</button>
              </div>
              <input type="hidden" name="audio" id="audioInput">
            </div>
          </div>

          <button type="submit" class="cta">Bidali</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer__inner">
      <p>GUZAN · Bermeo</p>
      <p>Alkarregaz</p>
    </div>
  </footer>

  <script>
    const form = document.getElementById('guzandaForm');
    const recordBtn = document.getElementById('recordBtn');
    const audioStatus = document.getElementById('audioStatus');
    const audioInput = document.getElementById('audioInput');
    const waveform = document.getElementById('waveform');
    const audioActions = document.getElementById('audioActions');
    const removeAudioBtn = document.getElementById('removeAudioBtn');

    const tabButtons = document.querySelectorAll('.tab');
    const tabPanels = document.querySelectorAll('.tab-panel');

    tabButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.tab;
        tabButtons.forEach((b) => {
          const active = b.dataset.tab === target;
          b.classList.toggle('active', active);
          b.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        tabPanels.forEach((p) => {
          p.classList.toggle('active', p.dataset.panel === target);
        });
      });
    });

    let mediaRecorder;
    let audioChunks = [];
    let audioBlobRef = null;

    const STORAGE_KEY = 'guzandaFormData';

    // Persist name, contact and description values as the user types
    const saveToStorage = () => {
      const data = {
        name: document.getElementById('name').value,
        contact: document.getElementById('contact').value,
        description: document.getElementById('description').value
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (err) {
        // localStorage may be unavailable (private mode, storage full); ignore
      }
    };

    // Restore saved values on page load (only name and contact)
    const restoreFromStorage = () => {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || typeof saved !== 'object') return;
        if (saved.name) document.getElementById('name').value = saved.name;
        if (saved.contact) document.getElementById('contact').value = saved.contact;
      } catch (err) {
        // ignore malformed storage data
      }
    };

    for (const field of ['name', 'contact', 'description']) {
      document.getElementById(field).addEventListener('input', saveToStorage);
    }
    restoreFromStorage();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      
      // If we have recorded audio, add it to form data
      if (audioBlobRef) {
        const audioFile = new File([audioBlobRef], `recording_${Date.now()}.webm`, { type: 'audio/webm' });
        formData.set('audio', audioFile);
      }

      try {
        const response = await fetch('/guzanda', {
          method: 'POST',
          body: formData
        });

        // Save form data to localStorage for later use
        saveToStorage();

        if (response.ok) {
          const html = await response.text();
          document.open();
          document.write(html);
          document.close();
        } else {
          const errorText = await response.text();
          audioStatus.textContent = `Errorea: ${errorText}`;
          audioStatus.style.color = 'red';
        }
      } catch (error) {
        audioStatus.textContent = `Errorea: ${error.message}`;
        audioStatus.style.color = 'red';
      }
    });

    const START_LABEL = 'Start Recording';
    const STOP_LABEL = 'Itxi / Stop Recording';

    function setRecordingUI(recording) {
      waveform.classList.toggle('recording', recording);
      if (recording) {
        recordBtn.textContent = STOP_LABEL;
        recordBtn.setAttribute('aria-pressed', 'true');
        audioActions.hidden = true;
      } else {
        recordBtn.textContent = START_LABEL;
        recordBtn.setAttribute('aria-pressed', 'false');
        waveform.classList.remove('recording');
        // Show the "remove / record another" option only if we have audio
        if (audioBlobRef) {
          audioActions.hidden = false;
        }
      }
    }

    recordBtn.addEventListener('click', async () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        audioStatus.textContent = 'Audioa grabatuta';
        audioStatus.style.color = 'var(--sea)';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);

        audioChunks = [];
        audioBlobRef = null;
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          // Clean up
          stream.getTracks().forEach(track => track.stop());
          audioBlobRef = new Blob(audioChunks, { type: 'audio/webm' });
          setRecordingUI(false);
        };

        mediaRecorder.start();
        setRecordingUI(true);
        audioStatus.textContent = '';
        audioStatus.style.color = 'var(--accent)';
      } catch (err) {
        audioStatus.textContent = `Errorea mikrofonokian atzitzean: ${err.message}`;
        audioStatus.style.color = 'red';
      }
    });

    removeAudioBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
      audioChunks = [];
      audioBlobRef = null;
      audioActions.hidden = true;
      audioStatus.textContent = '';
      recordBtn.textContent = START_LABEL;
      recordBtn.setAttribute('aria-pressed', 'false');
    });
  </script>
</body>
</html>
